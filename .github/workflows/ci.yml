# =============================================================================
#  CI —— 每次 push / PR 都跑一遍完整验证
#  ---------------------------------------------------------------------------
#  跑的是 `mvn verify`，也就是**单测 + 集成测试**：
#    · surefire  217 个单元测试（纯 Mockito，不依赖外部服务）
#    · failsafe  ExamTrackerIT —— 真实 MySQL + 真实 HTTP 的端到端测试
#
#  为什么不在这里用 Testcontainers：
#    开发机的 Docker 起不来（dockerDesktopLinuxEngine 管道不存在），
#    用了 Testcontainers 就会变成「本地跑不了、只有 CI 能跑」——
#    而本地能跑恰恰是这个测试存在的意义。
#    改用 services 起一个真正的 MySQL 8：本地和 CI 都是 MySQL 8，
#    SQL 语义一致，而且 CI 上少一层 Docker-in-Docker。
# =============================================================================
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # 允许手动触发，方便在改完 CI 之后先验一遍再提交
  workflow_dispatch:

# 同一个分支连续推送时，取消上一轮还在跑的构建 —— 省 runner 额度，
# 也避免「旧提交的绿灯」让人误以为最新代码没问题。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify（单测 + 集成测试）
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # 设了 MYSQL_DATABASE 才会给 MYSQL_USER 授这个库的权限；
          # 不设的话 dev 用户建出来了但没有库可用。
          MYSQL_DATABASE: exam_tracker
          MYSQL_USER: dev
          MYSQL_PASSWORD: dev123456
        ports:
          - 3306:3306
        # 健康检查 —— 少了它，job 会在 MySQL 还没就绪时就开跑，
        # 得到一个「连接被拒绝」的假失败。
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # schema.sql 是幂等的（CREATE DATABASE/TABLE IF NOT EXISTS），
      # 而且里面带了 USE 语句，所以直接用 root 整份跑掉最省事。
      # 用 dev 用户跑会失败 —— 它没有 CREATE DATABASE 权限。
      - name: 建表（sql/schema.sql）
        run: mysql -h 127.0.0.1 -P 3306 -uroot -proot < sql/schema.sql

      # Windows 上 checkout 出来的 mvnw 可能没有执行位，显式补一下。
      - name: 跑完整验证
        run: |
          chmod +x mvnw
          ./mvnw -B verify
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_NAME: exam_tracker
          DB_USERNAME: dev
          DB_PASSWORD: dev123456
          # 集成测试里有「今天/昨天/前天」这类日期逻辑，钉住时区，
          # 免得 runner 的 UTC 和开发机的 +08:00 出现跨日差异。
          TZ: Asia/Shanghai

      # 失败时的报告比日志有用得多（哪个断言、期望值、实际值都在里面）。
      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore
